<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARKSLAYERS | Gaming Community</title>
<meta name="description" content="DARKSLAYERS Gaming Community">
<style>html,body{margin:0;background:#050505;color:white;font-family:Arial,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;font-weight:900;color:#e32932}</style>
</head>
<body>
<div id="loading">DARKSLAYERS SE INCARCA...</div>
<script>
(async()=>{
 const base='https://cdn.jsdelivr.net/gh/skanboy17/DarkSlayers@ccea91e8978e5791da5a2cabcf5b4ea0a721cdad/';
 try{
   const response=await fetch(base+'index.html',{cache:'no-store'});
   if(!response.ok) throw new Error('HTTP '+response.status);
   let html=await response.text();
   html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+base+'">');
   document.open();document.write(html);document.close();
 }catch(err){
   document.body.innerHTML='<div id="loading">EROARE LA INCARCAREA DARKSLAYERS</div>';
   console.error(err);
 }
})();
</script>
</body>
</html>
