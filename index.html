<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DARKSLAYERS | Gaming Community</title>
<link rel="stylesheet" href="style.css?v=20261101-profile1">
</head>
<body>
<div id="app"></div>
<script>
(async function(){
  const app=document.getElementById('app');
  try {
    const r=await fetch('https://raw.githubusercontent.com/skanboy17/DarkSlayers/ccea91e8978e5791da5a2cabcf5b4ea0a721cdad/index.html',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html=await r.text();
    const body=html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    if(!body) throw new Error('Body missing');
    const temp=document.createElement('div');
    temp.innerHTML=body[1];
    temp.querySelectorAll('script').forEach(s=>s.remove());
    app.replaceWith(...Array.from(temp.childNodes));
    function load(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s);});}

    await load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');

    if (window.supabase && typeof window.supabase.createClient === 'function') {
      const originalCreateClient = window.supabase.createClient.bind(window.supabase);
      window.supabase.createClient = function(url, key, options) {
        const merged = Object.assign({}, options || {});
        merged.auth = Object.assign({}, (options && options.auth) || {}, {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storage: window.localStorage,
          storageKey: 'darkslayers-auth'
        });
        return originalCreateClient(url, key, merged);
      };
    }

    await load('script-base.js?v=20261101-profile1');
    await load('script.js?v=20261101-profile1');
    await load('roster-fix.js?v=20261101-profile1');
    await load('hall-roster-highlight.js?v=20261101-hofsilver1');
    await load('hall-of-fame.js?v=20261101-profile1');
    await load('member-profile.js?v=20261101-clickfix2');
    await load('forum-class-icons.js?v=20261101-classicons-final1');

    if (typeof loadForumTopics === 'function') {
      setTimeout(function(){ loadForumTopics(1); }, 100);
      setTimeout(function(){ loadForumTopics(1); }, 800);
    }

    if (typeof darkslayersSupabase !== 'undefined' && darkslayersSupabase && darkslayersSupabase.auth) {
      try { await darkslayersSupabase.auth.getSession(); } catch(e) { console.error('Session restore:', e); }
      if (typeof updateAccountButton === 'function') await updateAccountButton();
      if (typeof loadDarkSlayersRaidProgress === 'function') {
        setTimeout(loadDarkSlayersRaidProgress, 150);
        setTimeout(loadDarkSlayersRaidProgress, 900);
      }
      if (typeof loadForumTopics === 'function') setTimeout(function(){ loadForumTopics(1); }, 200);

      darkslayersSupabase.auth.onAuthStateChange(function(){
        setTimeout(function(){
          if (typeof updateAccountButton === 'function') updateAccountButton();
          if (typeof refreshAuthModal === 'function' && document.getElementById('loggedInPanel')) refreshAuthModal();
          if (typeof loadDarkSlayersRaidProgress === 'function') loadDarkSlayersRaidProgress();
          if (typeof loadForumTopics === 'function') loadForumTopics(DARKSLAYERS_FORUM_PAGE || 1);
          if (typeof window.refreshHallOfFame === 'function') window.refreshHallOfFame();
          if (typeof window.refreshHallRosterHighlight === 'function') window.refreshHallRosterHighlight();
          if (typeof window.refreshFeaturedHallMember === 'function') window.refreshFeaturedHallMember();
          if (typeof window.refreshForumClassIcons === 'function') setTimeout(window.refreshForumClassIcons,250);
        }, 150);
      });
    }
  } catch(e) {
    console.error(e);
    document.body.innerHTML='<div style="padding:40px;color:white;background:#050505;min-height:100vh;font-family:Arial"><h1 style="color:#d9272e">DARKSLAYERS</h1><p>Eroare la incarcarea site-ului.</p></div>';
  }
})();
</script>
</body>
</html>
