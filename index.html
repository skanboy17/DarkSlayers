<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DARKSLAYERS | Gaming Community</title>
<link rel="stylesheet" href="style.css?v=20261101-fix">
</head>
<body>
<div id="app"></div>
<script>
fetch('https://raw.githubusercontent.com/skanboy17/DarkSlayers/ccea91e8978e5791da5a2cabcf5b4ea0a721cdad/index.html')
.then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
.then(html=>{
 const body=html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
 document.getElementById('app').innerHTML=body?body[1]:html;
 const scripts=[...document.getElementById('app').querySelectorAll('script')];
 scripts.forEach(old=>{const s=document.createElement('script');[...old.attributes].forEach(a=>s.setAttribute(a.name,a.value));s.textContent=old.textContent;old.replaceWith(s)});
})
.catch(e=>{document.getElementById('app').innerHTML='<div style="padding:40px;color:white;background:#050505;min-height:100vh;font-family:Arial"><h1 style="color:#d9272e">DARKSLAYERS</h1><p>Eroare la incarcarea site-ului.</p></div>';console.error(e)});
</script>
</body>
</html>
